<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주군의 한수 - 대시보드</title>
    <link rel="stylesheet" href="/dashboard/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>주군의 한수</h1>
            <p class="subtitle">게임 기록 대시보드</p>
        </header>

        <nav class="tabs">
            <button class="tab active" data-tab="stats">게임 통계</button>
            <button class="tab" data-tab="leaderboard">리더보드</button>
            <button class="tab" data-tab="replay">기보 재생</button>
        </nav>

        <!-- 게임 통계 -->
        <section id="stats" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">총 게임</div>
                    <div class="stat-value" id="totalGames">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">플레이어 승률</div>
                    <div class="stat-value" id="winRate">0%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">플레이어 승</div>
                    <div class="stat-value win" id="playerWins">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">AI 승</div>
                    <div class="stat-value lose" id="aiWins">0</div>
                </div>
            </div>

            <div class="chart-section">
                <h3>게임 모드 분포</h3>
                <div class="mode-stats">
                    <div class="mode-item">
                        <span class="mode-label">연습 모드</span>
                        <span class="mode-value" id="practiceGames">0</span>
                    </div>
                    <div class="mode-item">
                        <span class="mode-label">챌린지 모드</span>
                        <span class="mode-value" id="challengeGames">0</span>
                    </div>
                </div>
            </div>

            <div class="chart-section">
                <h3>일별 게임 현황</h3>
                <div id="dailyStats" class="daily-stats"></div>
            </div>
        </section>

        <!-- 리더보드 -->
        <section id="leaderboard" class="tab-content">
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>순위</th>
                        <th>이름</th>
                        <th>점수</th>
                        <th>단계</th>
                        <th>돌 수</th>
                        <th>날짜</th>
                    </tr>
                </thead>
                <tbody id="leaderboardTable">
                </tbody>
            </table>
        </section>

        <!-- 기보 재생 -->
        <section id="replay" class="tab-content">
            <div class="replay-controls">
                <label for="gameSelect">게임 선택:</label>
                <select id="gameSelect">
                    <option value="">게임을 선택하세요</option>
                </select>
            </div>

            <div class="replay-board-wrapper">
                <canvas id="replayBoard" width="330" height="330"></canvas>
            </div>

            <div class="replay-info">
                <span id="replayInfo">게임을 선택하세요</span>
            </div>

            <div class="replay-buttons">
                <button id="btnFirst" class="replay-btn">처음</button>
                <button id="btnPrev" class="replay-btn">이전</button>
                <span id="moveCounter">0 / 0</span>
                <button id="btnNext" class="replay-btn">다음</button>
                <button id="btnLast" class="replay-btn">마지막</button>
                <button id="btnAuto" class="replay-btn">자동재생</button>
                <label class="pattern-toggle">
                    <input type="checkbox" id="showPatternLines" checked>
                    <span>패턴 선</span>
                </label>
            </div>
        </section>
    </div>

    <script src="/dashboard/static/board-renderer.js"></script>
    <script src="/dashboard/static/script.js"></script>
</body>
</html>
